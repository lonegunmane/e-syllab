services:
  - type: web
    name: e-syllab-api
    runtime: node
    region: oregon
    plan: free
    branch: main
    rootDir: google-drive-main
    buildCommand: npm install
    startCommand: npm run start
    healthCheckPath: /api/blockchain/status
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: RESEND_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SCHOOL_SIGNING_KEYPAIR
        sync: false
      - key: ALLOWED_ORIGIN
        value: https://e-syllab.vercel.app
    autoDeploy: true
